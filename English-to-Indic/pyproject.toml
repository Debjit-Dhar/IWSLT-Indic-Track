[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "english-speech-translation"
version = "0.1.0"
description = "English→Indic cascaded ST (Whisper ASR → fine-tuned NLLB) for IWSLT 2025"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "TBD" }
authors = [
  { name = "JU-CSE-NLP" },
]
keywords = [
  "speech-translation",
  "indic",
  "asr",
  "machine-translation",
  "iwslt",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.1",
  "torchaudio>=2.1",
  "transformers>=4.37,<4.45",
  "accelerate>=0.26",
  "datasets>=2.16",
  "sacrebleu>=2.4",
  "jiwer>=3.0",
  "pyyaml>=6.0",
  "pandas>=2.0",
  "numpy>=1.24",
  "soundfile>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]

[project.scripts]
indic-st-infer = "indic_speech_translation.inference:main"
indic-st-train = "indic_speech_translation.train:main"
indic-st-eval = "indic_speech_translation.evaluation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: tests requiring checkpoints/GPU/data (skipped by default)",
]
